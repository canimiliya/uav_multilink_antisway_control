[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-multilink-antisway-control"
version = "1.0.0"
description = "Reproducible MuJoCo benchmark for UAV multi-link anti-sway control"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "canimiliya"}]
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.6",
    "mujoco==3.0.1",
    "pyyaml==6.0.3",
    "matplotlib==3.11.1",
    "imageio==2.37.4",
    "scipy==1.17.1",
    "osqp==1.1.3",
]

[project.urls]
Homepage = "https://github.com/canimiliya/uav_multilink_antisway_control"
Repository = "https://github.com/canimiliya/uav_multilink_antisway_control"
Issues = "https://github.com/canimiliya/uav_multilink_antisway_control/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "third_party/udaan"]
